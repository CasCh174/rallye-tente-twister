<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f2a">
  <title>Rallye Tente</title>
  <style>
    :root{
      --bg:#f6f0df;
      --card:#fffaf2;
      --green:#173f2a;
      --red:#e5392d;
      --blue:#1976d2;
      --yellow:#f6c21a;
      --dotgreen:#49a84c;
      --shadow:rgba(23,63,42,.15);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--green);
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 12px calc(16px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 10% 15%, rgba(246,194,26,.13), transparent 18%),
        radial-gradient(circle at 90% 85%, rgba(73,168,76,.12), transparent 20%),
        var(--bg);
    }

    .app{
      width:min(720px,100%);
      text-align:center;
    }

    .flags{
      font-size:24px;
      letter-spacing:3px;
      margin-bottom:6px;
    }

    h1{
      margin:0 0 14px;
      font-size:clamp(2.1rem,8vw,3.8rem);
      line-height:1;
      font-weight:900;
    }

    .card{
      background:var(--card);
      border:3px solid var(--green);
      border-radius:28px;
      padding:14px 10px 18px;
      box-shadow:0 12px 0 var(--shadow);
    }

    .wheel-wrap{
      width:min(82vw,460px);
      aspect-ratio:1 / 1;
      margin:0 auto 12px;
      position:relative;
      max-width:100%;
    }

    .wheel{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:6px solid var(--green);
      overflow:hidden;
      background:
        conic-gradient(
          from -90deg,
          var(--red) 0deg 22.5deg,
          var(--blue) 22.5deg 45deg,
          var(--yellow) 45deg 67.5deg,
          var(--dotgreen) 67.5deg 90deg,

          var(--red) 90deg 112.5deg,
          var(--blue) 112.5deg 135deg,
          var(--yellow) 135deg 157.5deg,
          var(--dotgreen) 157.5deg 180deg,

          var(--red) 180deg 202.5deg,
          var(--blue) 202.5deg 225deg,
          var(--yellow) 225deg 247.5deg,
          var(--dotgreen) 247.5deg 270deg,

          var(--red) 270deg 292.5deg,
          var(--blue) 292.5deg 315deg,
          var(--yellow) 315deg 337.5deg,
          var(--dotgreen) 337.5deg 360deg
        );
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.65);
    }

    .sep,
    .qsep{
      position:absolute;
      left:50%;
      top:50%;
      border-radius:999px;
    }

    .sep{
      width:4px;
      height:50%;
      background:rgba(255,255,255,.95);
      transform-origin:bottom center;
      z-index:1;
    }

    .qsep{
      width:6px;
      height:50%;
      background:rgba(255,255,255,.98);
      transform-origin:bottom center;
      z-index:2;
    }

    .center{
      position:absolute;
      left:50%;
      top:50%;
      width:72px;
      height:72px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:var(--card);
      border:6px solid var(--green);
      z-index:6;
      box-shadow:0 4px 10px rgba(0,0,0,.08);
    }

    .center::after{
      content:"";
      position:absolute;
      inset:16px;
      border-radius:50%;
      background:var(--green);
    }

    .needle{
      --rot: 0deg;
      position:absolute;
      left:50%;
      top:50%;
      width:14px;
      height:42%;
      transform-origin:50% calc(100% - 10px);
      transform:translate(-50%, calc(-100% + 10px)) rotate(var(--rot));
      z-index:5;
      transition:transform 5.0s cubic-bezier(.12,.85,.18,1);
      filter:drop-shadow(0 4px 5px rgba(0,0,0,.18));
    }

    .needle::before{
      content:"";
      display:block;
      width:100%;
      height:100%;
      background:linear-gradient(#2b6b45,#173f2a);
      clip-path:polygon(50% 0%, 100% 28%, 68% 100%, 32% 100%, 0% 28%);
      border-radius:999px;
    }

    .label{
      position:absolute;
      z-index:3;
      width:72px;
      height:72px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,250,242,.92);
      border-radius:18px;
      border:2px solid rgba(23,63,42,.12);
      box-shadow:0 4px 10px rgba(0,0,0,.05);
      backdrop-filter:blur(2px);
    }

    .label svg{
      width:46px;
      height:46px;
      display:block;
      fill:var(--green);
    }

    .label.tl{top:12%; left:10%;}
    .label.tr{top:12%; right:10%;}
    .label.br{bottom:12%; right:10%;}
    .label.bl{bottom:12%; left:10%;}

    .result{
      margin:8px auto 0;
      padding:14px 12px;
      border-radius:18px;
      background:#fff;
      border:2px dashed rgba(23,63,42,.24);
      min-height:82px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:5px;
      width:min(100%, 430px);
    }

    .result .small{
      color:#607164;
      font-size:.92rem;
      font-weight:700;
    }

    .result .big{
      font-size:clamp(1.35rem,5.3vw,2.2rem);
      font-weight:900;
      line-height:1.05;
    }

    .controls{
      display:flex;
      justify-content:center;
      margin-top:14px;
    }

    button{
      min-width:min(100%, 330px);
      border:0;
      border-radius:18px;
      padding:18px 16px;
      font-size:1.12rem;
      font-weight:900;
      cursor:pointer;
      touch-action:manipulation;
      background:var(--green);
      color:#fff;
      box-shadow:0 7px 0 #10281b;
    }

    button:active{
      transform:translateY(4px);
      box-shadow:0 3px 0 #10281b;
    }

    @media (max-width:560px){
      .wheel-wrap{
        width:min(78vw,380px);
      }

      .label{
        width:58px;
        height:58px;
        border-radius:16px;
      }

      .label svg{
        width:36px;
        height:36px;
      }

      .center{
        width:62px;
        height:62px;
      }

      .center::after{
        inset:14px;
      }

      .needle{
        width:12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="flags">⛺️ 🌲 🎪 🌿</div>
    <h1>Rallye Tente</h1>

    <section class="card">
      <div class="wheel-wrap">
        <div class="wheel" aria-hidden="true"></div>

        <div class="sep" style="transform:translate(-50%, -100%) rotate(22.5deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(45deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(67.5deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(112.5deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(135deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(157.5deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(202.5deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(225deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(247.5deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(292.5deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(315deg)"></div>
        <div class="sep" style="transform:translate(-50%, -100%) rotate(337.5deg)"></div>

        <div class="qsep" style="transform:translate(-50%, -100%) rotate(0deg)"></div>
        <div class="qsep" style="transform:translate(-50%, -100%) rotate(90deg)"></div>
        <div class="qsep" style="transform:translate(-50%, -100%) rotate(180deg)"></div>
        <div class="qsep" style="transform:translate(-50%, -100%) rotate(270deg)"></div>

        <!-- Main gauche -->
        <div class="label tl" aria-label="Main gauche">
          <svg viewBox="0 0 64 64" style="transform:scaleX(-1)">
            <path d="M23 9c-2.5 0-4 2-4 4.5V26h-2V8.5C17 6 15 4 12.5 4S8 6 8 8.5V29c0 1-.5 1.5-1.5 1.5S5 30 5 29v-8.5C5 18 3 16 0.5 16S-4 18-4 20.5V35c0 6 3.5 10 8 13l8.5 5.5c3.5 2.2 5.4 6.1 5 10l-.1 1h25.6l.5-2.3c1.1-5.1 5.5-14 9.1-21.4 1.2-2.5 2.3-4.7 3-6.4 1.6-3.9.4-8.2-3.2-10-4-2-8.1.3-10.3 4.5L38 35V11.5C38 9 36 7 33.5 7S29 9 29 11.5V26h-2V13.5C27 11 25.5 9 23 9z" transform="translate(13,0) scale(.82)"/>
          </svg>
        </div>

        <!-- Main droite -->
        <div class="label tr" aria-label="Main droite">
          <svg viewBox="0 0 64 64">
            <path d="M23 9c-2.5 0-4 2-4 4.5V26h-2V8.5C17 6 15 4 12.5 4S8 6 8 8.5V29c0 1-.5 1.5-1.5 1.5S5 30 5 29v-8.5C5 18 3 16 0.5 16S-4 18-4 20.5V35c0 6 3.5 10 8 13l8.5 5.5c3.5 2.2 5.4 6.1 5 10l-.1 1h25.6l.5-2.3c1.1-5.1 5.5-14 9.1-21.4 1.2-2.5 2.3-4.7 3-6.4 1.6-3.9.4-8.2-3.2-10-4-2-8.1.3-10.3 4.5L38 35V11.5C38 9 36 7 33.5 7S29 9 29 11.5V26h-2V13.5C27 11 25.5 9 23 9z" transform="translate(13,0) scale(.82)"/>
          </svg>
        </div>

        <!-- Pied droit -->
        <div class="label br" aria-label="Pied droit">
          <svg viewBox="0 0 64 64">
            <g transform="translate(4,2)">
              <ellipse cx="37" cy="8" rx="5.2" ry="4.6"/>
              <ellipse cx="45.5" cy="13" rx="4.5" ry="4.1"/>
              <ellipse cx="50" cy="21" rx="3.8" ry="3.5"/>
              <ellipse cx="50.5" cy="29.5" rx="3.2" ry="3.0"/>
              <ellipse cx="47" cy="37" rx="2.8" ry="2.7"/>
              <path d="M22 55
                       C15 49, 11 40, 11 31
                       C11 23, 15 16, 21 13
                       C26 10, 34 12, 39 18
                       C43 23, 44.5 30, 43.5 36
                       C42.4 42.8, 39 48.2, 33.5 52.8
                       C29.8 55.9, 25.4 56.8, 22 55Z"/>
            </g>
          </svg>
        </div>

        <!-- Pied gauche -->
        <div class="label bl" aria-label="Pied gauche">
          <svg viewBox="0 0 64 64" style="transform:scaleX(-1)">
            <g transform="translate(4,2)">
              <ellipse cx="37" cy="8" rx="5.2" ry="4.6"/>
              <ellipse cx="45.5" cy="13" rx="4.5" ry="4.1"/>
              <ellipse cx="50" cy="21" rx="3.8" ry="3.5"/>
              <ellipse cx="50.5" cy="29.5" rx="3.2" ry="3.0"/>
              <ellipse cx="47" cy="37" rx="2.8" ry="2.7"/>
              <path d="M22 55
                       C15 49, 11 40, 11 31
                       C11 23, 15 16, 21 13
                       C26 10, 34 12, 39 18
                       C43 23, 44.5 30, 43.5 36
                       C42.4 42.8, 39 48.2, 33.5 52.8
                       C29.8 55.9, 25.4 56.8, 22 55Z"/>
            </g>
          </svg>
        </div>

        <div id="needle" class="needle"></div>
        <div class="center"></div>
      </div>

      <div class="result">
        <div class="small">Résultat</div>
        <div id="resultText" class="big">Appuie sur “Tourner l’aiguille”</div>
      </div>

      <div class="controls">
        <button id="spinBtn">Tourner l’aiguille</button>
      </div>
    </section>
  </main>

  <script>
    const needle = document.getElementById('needle');
    const resultText = document.getElementById('resultText');
    const spinBtn = document.getElementById('spinBtn');

    const sectors = [
      {limb:"Main droite", color:"Rouge"},
      {limb:"Main droite", color:"Bleu"},
      {limb:"Main droite", color:"Jaune"},
      {limb:"Main droite", color:"Vert"},

      {limb:"Pied droit", color:"Rouge"},
      {limb:"Pied droit", color:"Bleu"},
      {limb:"Pied droit", color:"Jaune"},
      {limb:"Pied droit", color:"Vert"},

      {limb:"Pied gauche", color:"Rouge"},
      {limb:"Pied gauche", color:"Bleu"},
      {limb:"Pied gauche", color:"Jaune"},
      {limb:"Pied gauche", color:"Vert"},

      {limb:"Main gauche", color:"Rouge"},
      {limb:"Main gauche", color:"Bleu"},
      {limb:"Main gauche", color:"Jaune"},
      {limb:"Main gauche", color:"Vert"}
    ];

    let currentRotation = 0;
    let spinning = false;

    function normalize(deg){
      return ((deg % 360) + 360) % 360;
    }

    function angleToSector(angle){
      const index = Math.floor(normalize(angle) / 22.5) % 16;
      return sectors[index];
    }

    function randomAngleAvoidingLines(){
      const sectorSize = 22.5;
      const margin = 2.2;
      const sectorIndex = Math.floor(Math.random() * 16);
      const min = sectorIndex * sectorSize + margin;
      const max = (sectorIndex + 1) * sectorSize - margin;
      return min + Math.random() * (max - min);
    }

    function setResult(item){
      resultText.textContent = item.limb + " — " + item.color;
    }

    function spin(){
      if (spinning) return;

      spinning = true;
      spinBtn.disabled = true;
      resultText.textContent = "L’aiguille tourne…";

      const targetAngle = randomAngleAvoidingLines();
      const targetItem = angleToSector(targetAngle);

      const extraSpins = 5 + Math.floor(Math.random() * 3);
      const currentNormalized = normalize(currentRotation);
      const deltaToTarget = normalize(targetAngle - currentNormalized);

      currentRotation += extraSpins * 360 + deltaToTarget;
      needle.style.setProperty('--rot', currentRotation + 'deg');

      setTimeout(() => {
        setResult(targetItem);
        spinning = false;
        spinBtn.disabled = false;
        if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
      }, 5050);
    }

    spinBtn.addEventListener('click', spin);
  </script>
</body>
</html>
