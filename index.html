<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f2a">
  <title>Rallye Tente — Twister classique</title>
  <style>
    :root{
      --bg:#f6f0df;
      --card:#fffaf2;
      --green:#173f2a;
      --green-2:#2b6b45;
      --red:#e5392d;
      --blue:#1976d2;
      --yellow:#f6c21a;
      --dotgreen:#49a84c;
      --shadow:rgba(23,63,42,.15);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--green);
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px 14px calc(18px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 10% 15%, rgba(246,194,26,.13), transparent 18%),
        radial-gradient(circle at 90% 85%, rgba(73,168,76,.12), transparent 20%),
        var(--bg);
    }

    .app{
      width:min(760px,100%);
      text-align:center;
    }

    .flags{
      font-size:26px;
      letter-spacing:3px;
      margin-bottom:6px;
    }

    h1{
      margin:0;
      font-size:clamp(2.1rem,8vw,3.9rem);
      line-height:1;
      font-weight:900;
    }

    .subtitle{
      margin:8px 0 18px;
      font-size:1rem;
      color:#5d6e61;
      font-weight:700;
    }

    .card{
      background:var(--card);
      border:3px solid var(--green);
      border-radius:28px;
      padding:18px 14px 20px;
      box-shadow:0 12px 0 var(--shadow);
    }

    .wheel-wrap{
      width:min(92vw,560px);
      aspect-ratio:1/1;
      margin:0 auto 18px;
      position:relative;
    }

    .wheel{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:6px solid var(--green);
      overflow:hidden;
      background:
        conic-gradient(
          from -90deg,
          /* main droite (top-right) */
          var(--yellow) 0deg 22.5deg,
          var(--blue) 22.5deg 45deg,
          var(--red) 45deg 67.5deg,
          var(--dotgreen) 67.5deg 90deg,

          /* pied droit (bottom-right) */
          var(--dotgreen) 90deg 112.5deg,
          var(--red) 112.5deg 135deg,
          var(--blue) 135deg 157.5deg,
          var(--yellow) 157.5deg 180deg,

          /* pied gauche (bottom-left) */
          var(--yellow) 180deg 202.5deg,
          var(--blue) 202.5deg 225deg,
          var(--red) 225deg 247.5deg,
          var(--dotgreen) 247.5deg 270deg,

          /* main gauche (top-left) */
          var(--dotgreen) 270deg 292.5deg,
          var(--red) 292.5deg 315deg,
          var(--blue) 315deg 337.5deg,
          var(--yellow) 337.5deg 360deg
        );
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.65);
    }

    /* white separators */
    .sep{
      position:absolute;
      left:50%;
      top:50%;
      width:4px;
      height:50%;
      background:rgba(255,255,255,.95);
      transform-origin:bottom center;
      translate:-50% -100%;
      border-radius:999px;
      z-index:1;
    }

    /* quadrant thick dividers */
    .qsep{
      position:absolute;
      left:50%;
      top:50%;
      width:6px;
      height:50%;
      background:rgba(255,255,255,.98);
      transform-origin:bottom center;
      translate:-50% -100%;
      border-radius:999px;
      z-index:2;
    }

    .center{
      position:absolute;
      left:50%;
      top:50%;
      width:78px;
      height:78px;
      translate:-50% -50%;
      border-radius:50%;
      background:var(--card);
      border:6px solid var(--green);
      z-index:6;
      box-shadow:0 4px 10px rgba(0,0,0,.08);
    }

    .center::after{
      content:"";
      position:absolute;
      inset:18px;
      border-radius:50%;
      background:var(--green);
    }

    .needle{
      position:absolute;
      left:50%;
      top:50%;
      width:14px;
      height:42%;
      transform-origin:50% calc(100% - 10px);
      translate:-50% calc(-100% + 10px);
      z-index:5;
      transition:transform 3.6s cubic-bezier(.12,.85,.18,1);
      filter:drop-shadow(0 4px 5px rgba(0,0,0,.18));
    }

    .needle::before{
      content:"";
      display:block;
      width:100%;
      height:100%;
      background:linear-gradient(#2b6b45,#173f2a);
      clip-path:polygon(50% 0%, 100% 28%, 68% 100%, 32% 100%, 0% 28%);
      border-radius:999px;
    }

    .label{
      position:absolute;
      font-weight:900;
      color:var(--green);
      font-size:clamp(.95rem,2.6vw,1.35rem);
      text-align:center;
      line-height:1.05;
      z-index:3;
      background:rgba(255,250,242,.88);
      padding:8px 10px;
      border-radius:16px;
      border:2px solid rgba(23,63,42,.12);
      backdrop-filter:blur(2px);
    }

    .label.tl{top:13%; left:9%;}
    .label.tr{top:13%; right:9%;}
    .label.br{bottom:13%; right:9%;}
    .label.bl{bottom:13%; left:9%;}

    .legend{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-top:10px;
    }

    .chip{
      padding:10px 8px;
      border-radius:16px;
      font-weight:900;
      font-size:.95rem;
      border:2px solid rgba(23,63,42,.12);
      background:#fff;
    }

    .chip.red{background:rgba(229,57,45,.12)}
    .chip.blue{background:rgba(25,118,210,.12)}
    .chip.yellow{background:rgba(246,194,26,.20)}
    .chip.green{background:rgba(73,168,76,.14)}

    .result{
      margin:16px 0 6px;
      padding:14px 12px;
      border-radius:18px;
      background:#fff;
      border:2px dashed rgba(23,63,42,.24);
      min-height:86px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:5px;
    }

    .result .small{
      color:#607164;
      font-size:.92rem;
      font-weight:700;
    }

    .result .big{
      font-size:clamp(1.45rem,5.5vw,2.35rem);
      font-weight:900;
      line-height:1.05;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-top:14px;
    }

    button{
      flex:1;
      border:0;
      border-radius:18px;
      padding:18px 16px;
      font-size:1.12rem;
      font-weight:900;
      cursor:pointer;
      touch-action:manipulation;
    }

    #spinBtn{
      background:var(--green);
      color:#fff;
      box-shadow:0 7px 0 #10281b;
    }

    #spinBtn:active{
      transform:translateY(4px);
      box-shadow:0 3px 0 #10281b;
    }

    #simpleBtn{
      background:#e7efe9;
      color:var(--green);
      box-shadow:0 7px 0 #c6d6cb;
    }

    #simpleBtn:active{
      transform:translateY(4px);
      box-shadow:0 3px 0 #c6d6cb;
    }

    .tiny{
      margin-top:14px;
      color:#617166;
      font-size:.82rem;
      font-weight:700;
    }

    @media (max-width:560px){
      .legend{grid-template-columns:repeat(2,1fr)}
      .controls{flex-direction:column}
      .label{padding:6px 8px}
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="flags">⛺️ 🌲 🎪 🌿</div>
    <h1>Rallye Tente</h1>
    <div class="subtitle">Version classique avec aiguille</div>

    <section class="card">
      <div class="wheel-wrap">
        <div class="wheel" aria-hidden="true"></div>

        <!-- separators every 22.5 degrees -->
        <div class="sep" style="transform:rotate(22.5deg)"></div>
        <div class="sep" style="transform:rotate(45deg)"></div>
        <div class="sep" style="transform:rotate(67.5deg)"></div>
        <div class="sep" style="transform:rotate(112.5deg)"></div>
        <div class="sep" style="transform:rotate(135deg)"></div>
        <div class="sep" style="transform:rotate(157.5deg)"></div>
        <div class="sep" style="transform:rotate(202.5deg)"></div>
        <div class="sep" style="transform:rotate(225deg)"></div>
        <div class="sep" style="transform:rotate(247.5deg)"></div>
        <div class="sep" style="transform:rotate(292.5deg)"></div>
        <div class="sep" style="transform:rotate(315deg)"></div>
        <div class="sep" style="transform:rotate(337.5deg)"></div>

        <!-- quadrant dividers -->
        <div class="qsep" style="transform:rotate(0deg)"></div>
        <div class="qsep" style="transform:rotate(90deg)"></div>
        <div class="qsep" style="transform:rotate(180deg)"></div>
        <div class="qsep" style="transform:rotate(270deg)"></div>

        <div class="label tl">Main<br>gauche</div>
        <div class="label tr">Main<br>droite</div>
        <div class="label br">Pied<br>droit</div>
        <div class="label bl">Pied<br>gauche</div>

        <div id="needle" class="needle"></div>
        <div class="center"></div>
      </div>

      <div class="legend">
        <div class="chip red">Rouge</div>
        <div class="chip blue">Bleu</div>
        <div class="chip yellow">Jaune</div>
        <div class="chip green">Vert</div>
      </div>

      <div class="result">
        <div class="small">Résultat</div>
        <div id="resultText" class="big">Appuie sur “Tourner l’aiguille”</div>
      </div>

      <div class="controls">
        <button id="spinBtn">Tourner l’aiguille</button>
        <button id="simpleBtn">Tirage instantané</button>
      </div>

      <div class="tiny">Fonctionne hors connexion une fois le fichier ouvert.</div>
    </section>
  </main>

  <script>
    const needle = document.getElementById('needle');
    const resultText = document.getElementById('resultText');
    const spinBtn = document.getElementById('spinBtn');
    const simpleBtn = document.getElementById('simpleBtn');

    // Order by angle, clockwise, starting at the top-right edge of the circle (0° at top, but we map by sector centers):
    // We use 16 sectors of 22.5° each. Sector 0 center is 11.25° clockwise from top.
    const sectors = [
      {limb:"Main droite", color:"Jaune"},
      {limb:"Main droite", color:"Bleu"},
      {limb:"Main droite", color:"Rouge"},
      {limb:"Main droite", color:"Vert"},

      {limb:"Pied droit", color:"Vert"},
      {limb:"Pied droit", color:"Rouge"},
      {limb:"Pied droit", color:"Bleu"},
      {limb:"Pied droit", color:"Jaune"},

      {limb:"Pied gauche", color:"Jaune"},
      {limb:"Pied gauche", color:"Bleu"},
      {limb:"Pied gauche", color:"Rouge"},
      {limb:"Pied gauche", color:"Vert"},

      {limb:"Main gauche", color:"Vert"},
      {limb:"Main gauche", color:"Rouge"},
      {limb:"Main gauche", color:"Bleu"},
      {limb:"Main gauche", color:"Jaune"}
    ];

    let currentRotation = 0;
    let spinning = false;

    function setResult(item){
      resultText.textContent = item.limb + " — " + item.color;
    }

    function spin(animated=true){
      if (spinning) return;
      const index = Math.floor(Math.random() * sectors.length);
      const item = sectors[index];

      if (!animated){
        currentRotation = currentRotation + 360;
        needle.style.transition = 'none';
        needle.style.transform = 'rotate(' + currentRotation + 'deg)';
        requestAnimationFrame(() => {
          needle.style.transition = 'transform 3.6s cubic-bezier(.12,.85,.18,1)';
        });
        setResult(item);
        if (navigator.vibrate) navigator.vibrate(25);
        return;
      }

      spinning = true;
      spinBtn.disabled = true;
      simpleBtn.disabled = true;

      // Center of target sector measured clockwise from top:
      const targetCenter = index * 22.5 + 11.25;

      // Needle points upward by default. To point to target sector, rotate clockwise to that center.
      // Add several full spins for animation.
      const extraSpins = 5 + Math.floor(Math.random() * 3);
      currentRotation = currentRotation + extraSpins * 360 + targetCenter;

      needle.style.transform = 'rotate(' + currentRotation + 'deg)';
      resultText.textContent = "L’aiguille tourne…";

      setTimeout(() => {
        setResult(item);
        spinning = false;
        spinBtn.disabled = false;
        simpleBtn.disabled = false;
        if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
      }, 3650);
    }

    spinBtn.addEventListener('click', () => spin(true));
    simpleBtn.addEventListener('click', () => spin(false));
  </script>
</body>
</html>
